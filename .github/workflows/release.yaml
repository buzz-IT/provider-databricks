name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GO_VERSION: "1.27.1"
      DOCKER_BUILDX_VERSION: "v0.37.1"
      CROSSPLANE_REGORG: "ghcr.io/buzz-it"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prepare terraform-provider-databricks
        run: make hack/terraform-provider-databricks

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Build provider package
        run: make -j2 XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.CROSSPLANE_REGORG }}" VERSION="${{ github.ref_name }}" build.all
        env:
          BUILD_ARGS: "--load"

      - name: Publish to GHCR
        run: make publish CHANNEL=stable VERSION="${{ github.ref_name }}"

      - name: GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          body: "Install with `package: ghcr.io/buzz-it/provider-databricks:${{ github.ref_name }}`"
