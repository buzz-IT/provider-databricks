apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresDataAPI
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresdataapi
  labels:
    testing.upbound.io/example-name: app_db
  name: app-db
spec:
  forProvider:
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: app_db
    spec:
      dbSchemas:
      - public

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresBranch
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresdataapi
  labels:
    testing.upbound.io/example-name: production
  name: production
spec:
  forProvider:
    branchId: production
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    replaceExisting: true
    spec:
      noExpiry: true

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresDatabase
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresdataapi
  labels:
    testing.upbound.io/example-name: app_db
  name: app-db
spec:
  forProvider:
    databaseId: app-db
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    spec:
      postgresDatabase: app_db
      role: ${databricks_postgres_role.app_owner.name}

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresProject
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresdataapi
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    projectId: my-project
    spec:
      displayName: My Project
      pgVersion: 18

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresRole
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresdataapi
  labels:
    testing.upbound.io/example-name: app_owner
  name: app-owner
spec:
  forProvider:
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    roleId: app-owner
    spec:
      postgresRole: app_owner
