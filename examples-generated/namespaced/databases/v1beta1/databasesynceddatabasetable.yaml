apiVersion: databases.databricks.m.crossplane.io/v1beta1
kind: DatabaseSyncedDatabaseTable
metadata:
  annotations:
    meta.upbound.io/example-id: databases/v1beta1/databasesynceddatabasetable
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: upbound-system
spec:
  forProvider:
    logicalDatabaseName: databricks_postgres
    name: my_database_catalog.public.synced_table
    spec:
      createDatabaseObjectsIfMissing: true
      newPipelineSpec:
        storageCatalog: source_delta
        storageSchema: tpch
      primaryKeyColumns:
      - c_custkey
      schedulingPolicy: SNAPSHOT
      sourceTableFullName: source_delta.tpch.customer
