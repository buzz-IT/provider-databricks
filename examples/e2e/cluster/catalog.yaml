apiVersion: unity.databricks.crossplane.io/v1beta1
kind: Catalog
metadata:
  annotations:
    meta.upbound.io/example-id: e2e/cluster/catalog
    uptest.upbound.io/timeout: "1800"
  labels:
    testing.upbound.io/example-name: e2e-catalog
  name: e2e-catalog
spec:
  forProvider:
    name: ${data.catalogName}
    comment: uptest e2e catalog
    properties:
      purpose: e2e
---
apiVersion: unity.databricks.crossplane.io/v1beta1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: e2e/cluster/catalog
    uptest.upbound.io/timeout: "1800"
  labels:
    testing.upbound.io/example-name: e2e-schema
  name: e2e-schema
spec:
  forProvider:
    catalogNameSelector:
      matchLabels:
        testing.upbound.io/example-name: e2e-catalog
    name: ${data.schemaName}
    comment: uptest e2e schema
