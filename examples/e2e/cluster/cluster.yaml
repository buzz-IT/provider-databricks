apiVersion: compute.databricks.crossplane.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: e2e/cluster/cluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: e2e-cluster
  name: e2e-cluster
spec:
  forProvider:
    clusterName: e2e-${Rand.RFC1123Subdomain}
    sparkVersion: ${data.sparkVersion}
    nodeTypeId: ${data.nodeTypeId}
    autoterminationMinutes: 20
    autoscale:
      minWorkers: 1
      maxWorkers: 2
