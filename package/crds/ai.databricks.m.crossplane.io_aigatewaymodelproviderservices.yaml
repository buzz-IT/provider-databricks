                            requests:
                              description: |-
                                Maximum requests allowed in one renewal period. Leave unset for no request
                                limit. Set to 0 to deny all requests
                              type: number
                            tokens:
                              description: |-
                                Maximum tokens allowed in one renewal period. Leave unset for no token
                                limit. Set to 0 to deny all requests
                              type: number
