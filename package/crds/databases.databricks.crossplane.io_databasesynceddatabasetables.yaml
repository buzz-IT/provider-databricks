                              type: string
                            size:
                              description: |-
                                Size parameter for the target type, for types that take one (e.g. vector
                                dimension, varchar length). Required when the chosen pg_type needs a size
                              type: number
                          type: object
                        type: array
                    type: object
                  unityCatalogProvisioningState:
