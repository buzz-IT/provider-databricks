---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: endpoints.serving.databricks.crossplane.io
spec:
  group: serving.databricks.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - databricks
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Endpoint is the Schema for the Endpoints API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EndpointSpec defines the desired state of Endpoint
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                properties:
                  awsVpcEndpointInfo:
                    description: Info for an AWS VPC endpoint
                    properties:
                      awsVpcEndpointId:
                        description: |-
                          The ID of the underlying VPC endpoint in AWS. Provided by the customer when
                          registering an existing AWS VPC endpoint
                        type: string
                    type: object
                  azurePrivateEndpointInfo:
                    description: Info for an Azure private endpoint
                    properties:
                      privateEndpointName:
                        description: The name of the Private Endpoint in the Azure
                          subscription
                        type: string
                      privateEndpointResourceGuid:
                        description: |-
                          The GUID of the Private Endpoint resource in the Azure subscription.
                          This is assigned by Azure when the user sets up the Private Endpoint
                        type: string
                    type: object
                  displayName:
                    description: |-
                      The human-readable display name of this endpoint.
                      The input should conform to RFC-1034, which restricts to letters, numbers, and hyphens,
                      with the first character a letter, the last a letter or a number, and a 63 character maximum
                    type: string
                  gcpPscEndpointInfo:
                    description: Info for a GCP Private Service Connect endpoint
                    properties:
                      endpointRegion:
                        description: |-
                          The GCP region of the PSC connection endpoint. Provided by the customer when registering an
                          existing PSC endpoint. GCP supports only same-region PSC, so this must match the workspace
                          region
                        type: string
                      projectId:
                        description: |-
                          The GCP consumer project ID in which this PSC endpoint is created. Provided by the customer
                          when registering an existing PSC endpoint
                        type: string
                      pscEndpoint:
                        description: |-
                          The name of this PSC connection in the GCP consumer project. Provided by the customer when
                          registering an existing PSC endpoint
                        type: string
                    type: object
                  parent:
                    description: |-
                      The parent resource name of the account under which the endpoint is created.
                      Format: accounts/{account_id}
                    type: string
                  region:
                    description: The cloud provider region where this endpoint is
                      located
                    type: string
                type: object
              initProvider:
                description: |-
                  THIS IS A BETA FIELD. It will be honored
                  unless the Management Policies feature flag is disabled.
                  InitProvider holds the same fields as ForProvider, with the exception
                  of Identifier and other resource reference fields. The fields that are
                  in InitProvider are merged into ForProvider when the resource is created.
                  The same fields are also added to the terraform ignore_changes hook, to
                  avoid updating them after creation. This is useful for fields that are
                  required on creation, but we do not desire to update them after creation,
                  for example because of an external controller is managing them, like an
                  autoscaler.
                properties:
                  awsVpcEndpointInfo:
                    description: Info for an AWS VPC endpoint
                    properties:
                      awsVpcEndpointId:
                        description: |-
                          The ID of the underlying VPC endpoint in AWS. Provided by the customer when
                          registering an existing AWS VPC endpoint
                        type: string
                    type: object
                  azurePrivateEndpointInfo:
                    description: Info for an Azure private endpoint
                    properties:
                      privateEndpointName:
                        description: The name of the Private Endpoint in the Azure
                          subscription
                        type: string
                      privateEndpointResourceGuid:
                        description: |-
                          The GUID of the Private Endpoint resource in the Azure subscription.
                          This is assigned by Azure when the user sets up the Private Endpoint
                        type: string
                    type: object
                  displayName:
                    description: |-
                      The human-readable display name of this endpoint.
                      The input should conform to RFC-1034, which restricts to letters, numbers, and hyphens,
                      with the first character a letter, the last a letter or a number, and a 63 character maximum
                    type: string
                  gcpPscEndpointInfo:
                    description: Info for a GCP Private Service Connect endpoint
                    properties:
                      endpointRegion:
                        description: |-
                          The GCP region of the PSC connection endpoint. Provided by the customer when registering an
                          existing PSC endpoint. GCP supports only same-region PSC, so this must match the workspace
                          region
                        type: string
                      projectId:
                        description: |-
                          The GCP consumer project ID in which this PSC endpoint is created. Provided by the customer
                          when registering an existing PSC endpoint
                        type: string
                      pscEndpoint:
                        description: |-
                          The name of this PSC connection in the GCP consumer project. Provided by the customer when
                          registering an existing PSC endpoint
                        type: string
                    type: object
                  parent:
                    description: |-
                      The parent resource name of the account under which the endpoint is created.
                      Format: accounts/{account_id}
                    type: string
                  region:
                    description: The cloud provider region where this endpoint is
                      located
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: spec.forProvider.displayName is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.displayName)
                || (has(self.initProvider) && has(self.initProvider.displayName))'
            - message: spec.forProvider.parent is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.parent)
                || (has(self.initProvider) && has(self.initProvider.parent))'
            - message: spec.forProvider.region is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.region)
                || (has(self.initProvider) && has(self.initProvider.region))'
          status:
            description: EndpointStatus defines the observed state of Endpoint.
            properties:
              atProvider:
                properties:
                  accountId:
                    description: The Databricks Account in which the endpoint object
                      exists
                    type: string
                  awsVpcEndpointInfo:
                    description: Info for an AWS VPC endpoint
                    properties:
                      awsAccountId:
                        description: The AWS account ID in which this VPC endpoint
                          lives
                        type: string
                      awsEndpointServiceId:
                        description: The ID of the Databricks VPC endpoint service
                          that this endpoint connects to
                        type: string
                      awsVpcEndpointId:
                        description: |-
                          The ID of the underlying VPC endpoint in AWS. Provided by the customer when
                          registering an existing AWS VPC endpoint
                        type: string
                    type: object
                  azurePrivateEndpointInfo:
                    description: Info for an Azure private endpoint
                    properties:
                      privateEndpointName:
                        description: The name of the Private Endpoint in the Azure
                          subscription
                        type: string
                      privateEndpointResourceGuid:
                        description: |-
                          The GUID of the Private Endpoint resource in the Azure subscription.
                          This is assigned by Azure when the user sets up the Private Endpoint
                        type: string
                      privateEndpointResourceId:
                        description: The full resource ID of the Private Endpoint
                        type: string
                      privateLinkServiceId:
                        description: The resource ID of the Databricks Private Link
                          Service that this Private Endpoint connects to
                        type: string
                    type: object
                  createTime:
                    description: The timestamp when the endpoint was created. The
                      timestamp is in RFC 3339 format in UTC timezone
                    type: string
                  displayName:
                    description: |-
                      The human-readable display name of this endpoint.
                      The input should conform to RFC-1034, which restricts to letters, numbers, and hyphens,
                      with the first character a letter, the last a letter or a number, and a 63 character maximum
                    type: string
                  endpointId:
                    description: The unique identifier for this endpoint under the
                      account. This field is a UUID generated by Databricks
                    type: string
                  gcpPscEndpointInfo:
                    description: Info for a GCP Private Service Connect endpoint
                    properties:
                      endpointRegion:
                        description: |-
                          The GCP region of the PSC connection endpoint. Provided by the customer when registering an
                          existing PSC endpoint. GCP supports only same-region PSC, so this must match the workspace
                          region
                        type: string
                      projectId:
                        description: |-
                          The GCP consumer project ID in which this PSC endpoint is created. Provided by the customer
                          when registering an existing PSC endpoint
                        type: string
                      pscConnectionId:
                        description: |-
                          The ID of the underlying Private Service Connect connection in the GCP consumer project,
                          assigned by GCP when the PSC connection is created
                        type: string
                      pscEndpoint:
                        description: |-
                          The name of this PSC connection in the GCP consumer project. Provided by the customer when
                          registering an existing PSC endpoint
                        type: string
                      serviceAttachmentId:
                        description: The ID of the Databricks service attachment this
                          PSC endpoint connects to
                        type: string
                    type: object
                  id:
                    type: string
                  name:
                    description: The resource name of the endpoint, which uniquely
                      identifies the endpoint
                    type: string
                  parent:
                    description: |-
                      The parent resource name of the account under which the endpoint is created.
                      Format: accounts/{account_id}
                    type: string
                  region:
                    description: The cloud provider region where this endpoint is
                      located
                    type: string
                  state:
                    description: 'The state of the endpoint. The endpoint can only
                      be used if the state is APPROVED. Possible values are: APPROVED,
                      DISCONNECTED, FAILED, PENDING'
                    type: string
                  useCase:
                    description: |-
                      The use case that determines the type of network connectivity this endpoint provides.
                      This field is automatically determined based on the endpoint configuration and cloud-specific settings. Possible values are: SERVICE_DIRECT
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
